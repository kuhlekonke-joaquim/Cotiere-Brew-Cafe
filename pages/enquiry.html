<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width, initial-scale=1.0">
     <title>Côtière Brew Café</title>
</head>

<body>

    <header>
        <h1>Côtière Brew Café</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>

    </header>
    <main>

        <section>

            <h2>Enquiry Form</h2>

            <p>
                Have a question about our café, menu, or services?
            </p>

            <p>
                 Please fill out the form bellow and we'll get back to you as soon as possible.
            </p>
            
            <!-- Enquiry Form -->
            <form action="submit_enquiry.php" method="post">

                <!-- Name and Surname  -->
                <label for="name">Name and Surname:</label>
                <input type="text" id="name" name="name" required>

                <!-- Email  -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                  <!-- Enquiry Type -->
                <label for="enquiry_type">Enquiry Type:</label>
                <select id="enquiry_type" name="enquiry_type" required>
                    <option value="">Select an option</option>
                    <option value="general">General Enquiry</option>
                    <option value="menu">Menu Enquiry</option>
                    <option value="reservation">Reservation Enquiry</option>
                    <option value="feedback">Feedback</option>

                </select>
                
                 <!-- Message  -->
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" cols="40" required></textarea> 

                <!-- Submit Button -->
                <input type="submit" value="Submit Enquiry">
            </form>

            <p>
                 We will respond to your enquiry as soon as possible.
            </p>

        </section>
    </main>
</body>
</html>
